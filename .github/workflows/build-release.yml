name: Build and Release Orizon OS

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-x86_64:
    name: Build x86_64 Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run CI release guard
        run: |
          mkdir -p artifacts
          python scripts/orizon/ci_release_guard.py --output-dir artifacts

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld xorriso qemu-system-x86 make curl

      - name: Build source sanity artifacts
        run: |
          set -o pipefail
          mkdir -p artifacts
          make clean
          make 2>&1 | tee artifacts/source-build.log

      - name: Package validated release bundle
        run: |
          set -euxo pipefail
          mkdir -p release/x86_64
          cp Orizon-OS.iso release/x86_64/Orizon-OS.iso
          cp updates/x86_64/kernel.elf release/x86_64/kernel.elf
          cp updates/x86_64/BOOTX64.EFI release/x86_64/BOOTX64.EFI
          cp updates/x86_64/limine.conf release/x86_64/limine.conf
          cp updates/x86_64/manifest.txt release/x86_64/manifest.txt
          cp updates/x86_64/manifest.sig release/x86_64/manifest.sig
          cp updates/x86_64/release.txt release/x86_64/release.txt
          cp artifacts/release-notes.md release/x86_64/RELEASE_NOTES.md
          cd release/x86_64
          sha256sum * > SHA256SUMS
          cd ../..
          tar -czf orizon-os-core-x86_64.tar.gz -C release/x86_64 .

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orizon-release-diagnostics
          path: |
            artifacts/quick-check-wrapper.log
            artifacts/quick-check.log
            artifacts/release-validation.log
            artifacts/release-notes.log
            artifacts/release-notes.md
            artifacts/release-summary.md
            artifacts/release-artifacts.json
            artifacts/source-build.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: orizon-os-core-x86_64
          path: orizon-os-core-x86_64.tar.gz
          retention-days: 90

  create-release:
    name: Create GitHub Release
    needs: [build-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout metadata
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: orizon-os-core-x86_64
          path: artifacts

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release notes
        run: |
          python scripts/orizon/release_notes.py --output release_notes.md

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: Orizon OS ${{ steps.version.outputs.value }}
          body_path: release_notes.md
          files: artifacts/orizon-os-core-x86_64.tar.gz
