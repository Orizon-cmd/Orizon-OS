name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-x86_64:
    name: Build x86_64 Core
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run CI release guard
        run: |
          mkdir -p artifacts
          python scripts/orizon/ci_release_guard.py --output-dir artifacts

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld xorriso qemu-system-x86 make curl

      - name: Build Orizon OS x86_64
        run: |
          set -o pipefail
          mkdir -p artifacts
          make clean
          make 2>&1 | tee artifacts/source-build.log

      - name: Check artifacts
        run: |
          ls -lh orizon-os-x86_64/build/kernel.elf
          ls -lh orizon-os-x86_64/orizonos-x86_64.iso
          file orizon-os-x86_64/build/kernel.elf

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orizon-ci-diagnostics
          path: |
            artifacts/quick-check-wrapper.log
            artifacts/quick-check.log
            artifacts/release-validation.log
            artifacts/release-notes.log
            artifacts/release-notes.md
            artifacts/release-summary.md
            artifacts/release-artifacts.json
            artifacts/source-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orizon-os-x86_64-ci
          path: |
            orizon-os-x86_64/build/kernel.elf
            orizon-os-x86_64/orizonos-x86_64.iso
          retention-days: 7
