name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-x86_64:
    name: Build x86_64 Core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run quick checks, release validation, and secret scan
        run: |
          mkdir -p artifacts
          python scripts/orizon/quick_check.py --log artifacts/quick-check.log

      - name: Generate release notes preview
        run: |
          mkdir -p artifacts
          python scripts/orizon/release_notes.py --output artifacts/release-notes.md

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orizon-ci-diagnostics
          path: |
            artifacts/quick-check.log
            artifacts/release-notes.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld xorriso qemu-system-x86 make curl

      - name: Build Orizon OS x86_64
        run: |
          make clean
          make

      - name: Check artifacts
        run: |
          ls -lh orizon-os-x86_64/build/kernel.elf
          ls -lh orizon-os-x86_64/orizonos-x86_64.iso
          file orizon-os-x86_64/build/kernel.elf

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orizon-os-x86_64-ci
          path: |
            orizon-os-x86_64/build/kernel.elf
            orizon-os-x86_64/orizonos-x86_64.iso
          retention-days: 7
